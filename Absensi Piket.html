                                                <th className="p-2 border-r border-slate-300">Hari & Tanggal</th>
                                                <th className="p-2 border-r border-slate-300 text-center">Jadwal Tugas</th>
                                                <th className="p-2 border-r border-slate-300">Rincian Jam Hadir</th>
                                                <th className="p-2 border-r border-slate-300">Rincian Jam Kosong / Absen</th>
                                                <th className="p-2 border-r border-slate-300 text-center">Total (H/K)</th>
                                                <th className="p-2 border-r border-slate-300 text-right">Infaq Harian</th>
                                                <th className="p-2">Keterangan</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200">
                                            {filteredPeriodRecords.length === 0 ? (
                                                <tr>
                                                    <td colSpan="8" className="p-4 text-center text-slate-500 italic">
                                                        Tidak ada data rekapitulasi kehadiran piket dicatat dalam periode {formatDateIndo(startDate)} s/d {formatDateIndo(endDate)}.
                                                    </td>
                                                </tr>
                                            ) : (
                                                filteredPeriodRecords.map((rec, idx) => {
                                                    const { attendedLabels, missedLabels } = getPeriodsDetail(rec);
                                                    return (
                                                        <tr key={rec.id} className={rec.totalMissed > 0 ? 'bg-rose-50/30' : 'bg-white'}>
                                                            <td className="p-2 border-r border-slate-300 text-center font-medium">{idx + 1}</td>
                                                            <td className="p-2 border-r border-slate-300 font-semibold">{rec.dayName}, {formatDateIndo(rec.date)}</td>
                                                            <td className="p-2 border-r border-slate-300 text-center font-mono whitespace-nowrap">
                                                                {getSlotLabel(rec.startPeriod)} - {getSlotLabel(rec.endPeriod)}
                                                            </td>
                                                            <td className="p-2 border-r border-slate-300">
                                                                {attendedLabels.length > 0 ? (
                                                                    <span className="font-semibold text-emerald-800">
                                                                        {attendedLabels.join(', ')}
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-slate-400 italic">Nihil</span>
                                                                )}
                                                            </td>
                                                            <td className="p-2 border-r border-slate-300">
                                                                {missedLabels.length > 0 ? (
                                                                    <span className="font-semibold text-rose-800">
                                                                        {missedLabels.join(', ')}
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-emerald-700 italic font-medium">Nihil (Hadir Full)</span>
                                                                )}
                                                            </td>
                                                            <td className="p-2 border-r border-slate-300 text-center font-bold whitespace-nowrap">
                                                                <span className="text-emerald-700">{rec.totalAttended}H</span> / <span className="text-rose-700">{rec.totalMissed}K</span>
                                                            </td>
                                                            <td className="p-2 border-r border-slate-300 text-right font-bold text-slate-800 whitespace-nowrap">
                                                                {formatRupiah(rec.totalInfaq || 0)}
                                                            </td>
                                                            <td className="p-2 text-slate-600 text-[11px]">
                                                                {rec.notes || (rec.totalMissed === 0 ? 'Hadir Penuh' : '-')}
                                                            </td>
                                                        </tr>
                                                    );
                                                })
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Summary Box */}
                                <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 my-4">
                                    <h4 className="font-bold text-amber-900 text-xs mb-2 uppercase tracking-wider">
                                        Ringkasan Total Akumulasi Periode ({formatDateIndo(startDate)} - {formatDateIndo(endDate)}):
                                    </h4>
                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs mb-3 border-b border-amber-200 pb-3">
                                        <div>
                                            <span className="text-amber-800 text-[11px]">Total Hari Piket:</span>
                                            <p className="font-bold text-slate-900 text-sm">{totalScheduledDays} Hari</p>
                                        </div>
                                        <div>
                                            <span className="text-amber-800 text-[11px]">Total Jam Terjadwal:</span>
                                            <p className="font-bold text-slate-900 text-sm">{totalScheduledHours} Jam</p>
                                        </div>
                                        <div>
                                            <span className="text-amber-800 text-[11px]">Total Jam Hadir:</span>
                                            <p className="font-bold text-emerald-700 text-sm">{totalAttendedHours} Jam</p>
                                        </div>
                                        <div>
                                            <span className="text-amber-800 text-[11px]">Total Jam Kosong:</span>
                                            <p className="font-bold text-rose-700 text-sm">{totalMissedHours} Jam</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 pt-1">
                                        <div>
                                            <span className="text-xs font-bold text-amber-900 uppercase">Total Kewajiban Infaq Periode Ini:</span>
                                            <p className="text-[11px] text-amber-700">Dihitung dari {totalMissedHours} jam kosong x nominal tarif infaq</p>
                                        </div>
                                        <div className="text-lg sm:text-xl font-extrabold text-rose-700 bg-white px-4 py-1.5 rounded-lg border border-amber-300 shadow-sm">
                                            {formatRupiah(totalPeriodInfaq)}
                                        </div>
                                    </div>
                                </div>

                                <p>
                                    Demikian rekapitulasi surat pemberitahuan ini disampaikan sebagai bahan evaluasi, motivasi penegakan disiplin, dan tertib administrasi sekolah. Atas perhatian dan kerja samanya kami ucapkan terima kasih.
                                </p>
                                <p><i>Wassalamu’alaikum Warahmatullahi Wabarakatuh.</i></p>
                            </div>

                            {/* Signatures - Cukup Kepala Sekolah Saja */}
                            <div className="mt-12 pt-4 flex justify-end text-center text-xs">
                                <div className="w-64">
                                    <p className="font-medium text-slate-600">Mengetahui,</p>
                                    <p className="font-bold text-slate-900">Kepala Sekolah</p>
                                    <div className="h-20"></div>
                                    <p className="font-bold underline text-slate-900">{schoolInfo.principalName}</p>
                                    <p className="text-[11px] text-slate-500">NIP. {schoolInfo.principalNip}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PengaturanView({ infaqRate, setInfaqRate, schoolInfo, setSchoolInfo, showNotification, formatRupiah }) {
            const [rateInput, setRateInput] = useState(infaqRate);
            const [schoolForm, setSchoolForm] = useState(schoolInfo);

            const handleSaveSettings = (e) => {
                e.preventDefault();
                setInfaqRate(Number(rateInput));
                setSchoolInfo(schoolForm);
                showNotification('Pengaturan infaq & identitas sekolah berhasil disimpan!');
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 className="text-xl font-bold text-slate-800">Pengaturan Infaq & Sekolah</h2>
                        <p className="text-xs text-slate-500 mt-0.5">Konfigurasi nominal infaq per jam dan identitas kearsipan surat sekolah</p>
                    </div>

                    <form onSubmit={handleSaveSettings} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                        <div className="bg-amber-50/70 p-4 rounded-xl border border-amber-200">
                            <label className="block text-xs font-bold text-amber-900 uppercase tracking-wider mb-1">
                                Nominal Infaq Ketidakhadiran per Jam (Rp) *
                            </label>
                            <p className="text-xs text-amber-700 mb-3">
                                Tarif ini dikalikan dengan total jam piket yang ditinggalkan / tidak dihadiri oleh guru.
                            </p>
                            <div className="relative max-w-xs">
                                <span className="absolute left-3.5 top-2.5 font-bold text-slate-500 text-sm">Rp</span>
                                <input 
                                    type="number"
                                    required
                                    min="0"
                                    step="500"
                                    value={rateInput}
                                    onChange={(e) => setRateInput(e.target.value)}
                                    className="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                />
                            </div>
                            <p className="text-xs font-semibold text-amber-800 mt-2">
                                Pratinjau Contoh: 5 jam tidak hadir = <strong>{formatRupiah(rateInput * 5)}</strong>
                            </p>
                        </div>

                        <div className="space-y-4">
                            <h3 className="text-sm font-bold text-slate-800 border-b border-slate-200 pb-2">Identitas Kearsipan Surat Sekolah</h3>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Instansi / Sekolah</label>
                                <input 
                                    type="text" 
                                    value={schoolForm.name}
                                    onChange={(e) => setSchoolForm({ ...schoolForm, name: e.target.value })}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Alamat Lengkap</label>
                                <input 
                                    type="text" 
                                    value={schoolForm.address}
                                    onChange={(e) => setSchoolForm({ ...schoolForm, address: e.target.value })}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-1">Kontak / Email / Telepon Kop Surat</label>
                                <input 
                                    type="text" 
                                    value={schoolForm.phone}
                                    onChange={(e) => setSchoolForm({ ...schoolForm, phone: e.target.value })}
                                    className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                />
                            </div>

                            <div className="grid grid-cols-2 gap-3 pt-2">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Kepala Sekolah</label>
                                    <input 
                                        type="text" 
                                        value={schoolForm.principalName}
                                        onChange={(e) => setSchoolForm({ ...schoolForm, principalName: e.target.value })}
                                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">NIP Kepala Sekolah</label>
                                    <input 
                                        type="text" 
                                        value={schoolForm.principalNip}
                                        onChange={(e) => setSchoolForm({ ...schoolForm, principalNip: e.target.value })}
                                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none font-mono"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="pt-4 flex justify-end">
                            <button
                                type="submit"
                                className="bg-brand-600 hover:bg-brand-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow transition flex items-center space-x-2"
                            >
                                <i className="fa-solid fa-floppy-disk"></i>
                                <span>Simpan Seluruh Pengaturan</span>
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
